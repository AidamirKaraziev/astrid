# =============================================================================
# Astra — полный стек в Docker
#
# Одна команда (тесты → сборка → запуск):
#   make up
#   ./scripts/docker-up.sh
#
# Только инфраструктура (dev на хосте):
#   docker compose up -d postgres redis
#
# Только тесты в контейнере:
#   docker compose --profile test run --rm test
# =============================================================================

name: astra

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

# Внутренние URL сервисов Docker-сети (перекрывают localhost из .env)
x-app-env: &app-env
  APP_ENV: production
  DEBUG: "false"
  # Человекочитаемые логи: сборщика (Loki) нет, stdout читает человек.
  # Появится сборщик — вернуть json.
  LOG_FORMAT: plain
  OTEL_ENABLED: "false"
  # SENTRY_DSN и SENTRY_ENVIRONMENT — из .env (env_file); для prod обычно SENTRY_ENVIRONMENT=prod
  TELEGRAM_MODE: polling
  DATABASE_URL: postgresql+asyncpg://astra:astra@postgres:5432/astra
  REDIS_URL: redis://redis:6379/0
  FSM_STORAGE: redis
  RABBITMQ_URL: amqp://astra:astra@rabbitmq:5672/

x-restart: &restart
  restart: unless-stopped

services:
  # ---------------------------------------------------------------------------
  # Инфраструктура
  # ---------------------------------------------------------------------------

  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: astra
      POSTGRES_PASSWORD: astra
      POSTGRES_DB: astra
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra -d astra"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    <<: *restart
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    <<: *restart
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: astra
      RABBITMQ_DEFAULT_PASS: astra
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Тесты перед сборкой приложения (profile: test)
  # ---------------------------------------------------------------------------

  test:
    profiles: [test]
    build:
      <<: *app-build
      target: dev
    environment:
      <<: *app-env
      TELEGRAM_BOT_TOKEN: "0000000000:TEST_TOKEN_FOR_CI"
      TELEGRAM_BOT_USERNAME: TestAstraBot
      TELEGRAM_MODE: polling
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             pytest -v --cov=astra --cov-report=term-missing"

  # ---------------------------------------------------------------------------
  # Приложение
  # ---------------------------------------------------------------------------

  api:
    <<: *restart
    build:
      <<: *app-build
      target: runtime
    env_file:
      - .env
    environment:
      <<: *app-env
      SENTRY_SERVICE: api
      COMPATIBILITY_PDF_DIR: /data/compatibility
    volumes:
      - compatibility_data:/data/compatibility
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn astra.main:app --host 0.0.0.0 --port 8000 --app-dir src"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

  worker:
    <<: *restart
    build:
      <<: *app-build
      target: runtime
    env_file:
      - .env
    environment:
      <<: *app-env
      SENTRY_SERVICE: worker
      COMPATIBILITY_PDF_DIR: /data/compatibility
    volumes:
      - compatibility_data:/data/compatibility
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && astra-worker"

  # Панель отдельным процессом (profile: admin) — сейчас не нужна: /admin едет
  # внутри api. Понадобится, когда у api появится публичный адрес под вебхук
  # оплаты: тогда убрать include_router(admin_router) из astra.main и поднимать
  # этот сервис. Адрес панели не изменится, только порт.
  # Запуск: docker compose --profile admin up -d admin
  # На проде порт стоит привязать к tailscale-интерфейсу: "100.120.8.76:8001:8001".
  admin:
    profiles: [admin]
    <<: *restart
    build:
      <<: *app-build
      target: runtime
    env_file:
      - .env
    environment:
      <<: *app-env
      SENTRY_SERVICE: admin
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    command: astra-admin
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  compatibility_data:
