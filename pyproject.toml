[project]
name = "astra"
version = "0.1.0"
description = "Astra — персональные предсказания в Telegram"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.6.2",
    "aiohttp-socks>=0.10.0",
    "aiogram>=3.17.0",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.136.1",
    "httpx[socks]>=0.28.0",
    "pydantic-settings>=2.7.0",
    "redis>=5.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.34.0",
    "sentry-sdk[fastapi]>=2.61.1",
    "kerykeion>=5.12.9",
    "pillow>=11.0.0",
    "pymorphy3>=2.0.6",
    "reportlab>=4.2.0",
    "structlog>=26.1.0",
    "opentelemetry-api>=1.43.0",
    "opentelemetry-sdk>=1.43.0",
    "opentelemetry-instrumentation-fastapi>=0.64b0",
    "opentelemetry-instrumentation-httpx>=0.64b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.64b0",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20.0",
    "fakeredis>=2.26.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
]

[project.scripts]
astra-api = "astra.main:run"
astra-worker = "astra.workers.main:run"
# Панель отдельным процессом: нужна, когда /admin надо увести с публичного порта
astra-admin = "astra.admin.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astra"]

[tool.hatch.build.targets.wheel.force-include]
"src/astra/reports/synastry/assets" = "astra/reports/synastry/assets"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["astra"]
omit = ["*/tests/*"]
